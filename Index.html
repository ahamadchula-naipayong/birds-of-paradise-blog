    const { useState, useMemo, useEffect, useRef } = React;

    // 🔴 ใส่ Web App Exec URL ที่ได้จากการ Deploy Apps Script ที่นี่

    const IconPrinter = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
    const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const IconMessage = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
    const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconArrowUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>;

    const themesConfig = {
      base: {
        bgBody: "#0E1428", bgApp: "bg-[#0E1428]", bgHeader: "bg-[#0E1428]/85 border-b border-[#2A6A8B]/30",
        bgCard: "bg-[#1A223D] border-[#2A6A8B]/30 shadow-lg",
        textMain: "text-white", textMuted: "text-[#8E9BBD]", textAccent: "text-[#1D9A9F]",
        bgBadge: "bg-[#1D9A9F]/20 text-[#6CE5EA] border border-[#1D9A9F]/30",
        btnPrimary: "bg-gradient-to-r from-[#6A359C] to-[#1D9A9F] text-white hover:brightness-110",
        tabContainer: "bg-[#1A223D] border border-[#2A6A8B]/30", tabActive: "bg-[#2A6A8B] text-white font-bold shadow-md", tabInactive: "bg-transparent text-[#8E9BBD] hover:text-white hover:bg-[#2A6A8B]/20",
        filterActive: "bg-[#1D9A9F] text-[#0E1428] font-bold shadow-sm", filterInactive: "bg-[#1A223D] text-[#8E9BBD] border border-[#2A6A8B]/40 hover:bg-[#2A6A8B]/20",
        inputSearch: "bg-[#1A223D] border border-[#2A6A8B]/40 text-white placeholder-[#8E9BBD] focus:border-[#1D9A9F]",
        inputForm: "bg-[#0E1428] border border-[#2A6A8B]/40 text-white focus:border-[#1D9A9F] placeholder-[#8E9BBD]",
        hr: "border-[#2A6A8B]/30", skeletonBg: "bg-[#1A223D]", supportCardBg: "bg-gradient-to-br from-[#2D1B54] via-[#6A359C] to-[#1D9A9F]",
        qrBox: "bg-[#1A223D] border border-[#2A6A8B]/30 text-white", scrollBtn: "bg-[#0E1428]/90 text-[#1D9A9F]"
      },
      brown: {
        bgBody: "#FAF7F2", bgApp: "bg-[#FAF7F2]", bgHeader: "bg-[#FAF7F2]/90 border-b border-[#E8DFD8]",
        bgCard: "bg-white border-[#E8DFD8] shadow-sm",
        textMain: "text-[#4A3B32]", textMuted: "text-[#8C7A6B]", textAccent: "text-[#C46A29]",
        bgBadge: "bg-[#D97736]/10 text-[#C46A29] border border-[#D97736]/20",
        btnPrimary: "bg-gradient-to-r from-[#8D6E63] to-[#C46A29] text-white hover:brightness-105",
        tabContainer: "bg-[#EFEAE6] border border-[#E8DFD8]", tabActive: "bg-[#4A3B32] text-white font-bold shadow-sm", tabInactive: "bg-transparent text-[#8C7A6B] hover:text-[#4A3B32] hover:bg-white/50",
        filterActive: "bg-[#C46A29] text-white font-bold", filterInactive: "bg-white text-[#8C7A6B] border border-[#E8DFD8] hover:bg-[#F2ECE6]",
        inputSearch: "bg-white border border-[#E8DFD8] text-[#4A3B32] placeholder-[#8C7A6B] focus:border-[#C46A29]",
        inputForm: "bg-[#FAF7F2] border border-[#E8DFD8] text-[#4A3B32] focus:border-[#C46A29] placeholder-[#8C7A6B]",
        hr: "border-[#E8DFD8]", skeletonBg: "bg-[#E8DFD8]", supportCardBg: "bg-gradient-to-br from-[#8D6E63] to-[#A1887F]",
        qrBox: "bg-[#FAF7F2] border border-[#E8DFD8] text-[#4A3B32]", scrollBtn: "bg-[#FAF7F2]/90 text-[#C46A29]"
      },
      dark: {
        bgBody: "#121212", bgApp: "bg-[#121212]", bgHeader: "bg-[#121212]/90 border-b border-[#2A2A2A]",
        bgCard: "bg-[#1A1A1A] border-[#2A2A2A] shadow-md",
        textMain: "text-[#E0E0E0]", textMuted: "text-[#888888]", textAccent: "text-[#10B981]",
        bgBadge: "bg-[#10B981]/10 text-[#10B981] border border-[#10B981]/20",
        btnPrimary: "bg-gradient-to-r from-[#059669] to-[#10B981] text-white hover:brightness-110",
        tabContainer: "bg-[#1A1A1A] border border-[#2A2A2A]", tabActive: "bg-[#10B981] text-white font-bold shadow-md", tabInactive: "bg-transparent text-[#888888] hover:text-white hover:bg-[#2A2A2A]",
        filterActive: "bg-[#10B981] text-white font-bold", filterInactive: "bg-[#1A1A1A] text-[#888888] border border-[#2A2A2A] hover:bg-[#2A2A2A]",
        inputSearch: "bg-[#1A1A1A] border border-[#2A2A2A] text-white placeholder-[#888888] focus:border-[#10B981]",
        inputForm: "bg-[#121212] border border-[#2A2A2A] text-white focus:border-[#10B981] placeholder-[#888888]",
        hr: "border-[#2A2A2A]", skeletonBg: "bg-[#2A2A2A]", supportCardBg: "bg-gradient-to-br from-[#064E3B] to-[#059669]",
        qrBox: "bg-[#1A1A1A] border border-[#2A2A2A] text-white", scrollBtn: "bg-[#121212]/90 text-[#10B981]"
      }
    };

    const parseMarkdownWithArabic = (text) => {
      if (!text) return "";
      let html = marked.parse(text);
      const arabicRegex = /([\u0600-\u06FF\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+(?:\s+[\u0600-\u06FF\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)*)/g;
      return html.replace(arabicRegex, '<span class="font-amiri text-[1.25em] leading-normal font-normal" dir="rtl">$1</span>');
    };

    function App() {
      const [database, setDatabase] = useState({});
      const [tabOrderList, setTabOrderList] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [activeTab, setActiveTab] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedSubcategory, setSelectedSubcategory] = useState("All");
      const [selectedDate, setSelectedDate] = useState("");
      const [sortOrder, setSortOrder] = useState("newest");
      
      const [viewingArticle, setViewingArticle] = useState(null);
      const [fontSizeLevel, setFontSizeLevel] = useState(0); 
      const fontSizes = ["text-base", "text-lg", "text-xl"];
      const headingSizes = ["text-2xl sm:text-3xl", "text-3xl sm:text-4xl", "text-4xl sm:text-5xl"];
      const [currentFontFamily, setCurrentFontFamily] = useState("Mali");

      const [isContactSubmitting, setIsContactSubmitting] = useState(false);
      const [contactType, setContactType] = useState("ส่งข่าวสาร");
      const [toastMessage, setToastMessage] = useState(null);
      
      const headerTabsRef = useRef(null);
      const subTabsRef = useRef(null);
      const [currentTheme, setCurrentTheme] = useState("base");
      const t = themesConfig[currentTheme];

      const [articleStats, setArticleStats] = useState({ views: 0, likes: 0, comments: [] });
      const [hasLiked, setHasLiked] = useState(false);
      const [isCommentSubmitting, setIsCommentSubmitting] = useState(false);
      const [readProgress, setReadProgress] = useState(0);
      const [showScrollTop, setShowScrollTop] = useState(false);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => { document.body.style.backgroundColor = t.bgBody; }, [currentTheme]);
      const toggleTheme = () => setCurrentTheme(["base", "brown", "dark"][([ "base", "brown", "dark" ].indexOf(currentTheme) + 1) % 3]);
      const toggleFontFamily = () => setCurrentFontFamily(prev => prev === "Mali" ? "Kanit" : "Mali");
      const scrollContainer = (ref, dir) => { if (ref.current) ref.current.scrollBy({ left: dir === 'right' ? 220 : -220, behavior: 'smooth' }); };

      useEffect(() => {
        const handlePopState = () => setViewingArticle(null);
        window.addEventListener("popstate", handlePopState);
        
        const handleScroll = () => {
          const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
          if (totalHeight > 0) {
            setReadProgress((window.scrollY / totalHeight) * 100);
          }
          setShowScrollTop(window.scrollY > 400);
        };
        window.addEventListener("scroll", handleScroll);

        return () => {
          window.removeEventListener("popstate", handlePopState);
          window.removeEventListener("scroll", handleScroll);
        };
      }, []);

      const openArticle = (article) => {
        setViewingArticle(article);
        window.history.pushState({ page: 'article' }, "", "#read");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const closeArticle = () => window.history.back();
      const scrollToSection = (e, num) => { 
        e.preventDefault(); 
        const section = document.getElementById(`section-${num}`); 
        if(section) section.scrollIntoView({ behavior: 'smooth' }); 
      };

      // Fetch Sheet Data via Web API
      useEffect(() => {
        if (!GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
          fetch(`${GAS_API_URL}?action=getSheetData`)
            .then(res => res.json())
            .then(response => {
              if (response.status === 'success') {
                setDatabase(response.data);
                setTabOrderList(response.tabOrder || Object.keys(response.data));
                if (response.tabOrder && response.tabOrder.includes("NEWS")) {
                  setActiveTab("NEWS");
                } else if (response.tabOrder && response.tabOrder.length > 0) {
                  setActiveTab(response.tabOrder[0]);
                }
              }
              setIsLoading(false);
            })
            .catch(() => setIsLoading(false));
        } else {
          // Demo fallback
          const mock = { "NEWS": [{ id: "n1", date: "2026-04-01", subcategory: "ทั่วไป", title: "ยินดีต้อนรับสู่ Birds of Paradise Blogs", content1: "ระบบเชื่อมต่อ API สำเร็จ สามารถนำไปโฮสต์บน GitHub Pages ได้ทันที", content2: "ตัวอย่างเนื้อหาท่อนที่สอง" }] };
          setTimeout(() => {
            setDatabase(mock);
            setTabOrderList(["NEWS"]);
            setActiveTab("NEWS");
            setIsLoading(false);
          }, 800);
        }
      }, []);

      // Load Engagement
      useEffect(() => {
        if (viewingArticle) {
          const likedStatus = localStorage.getItem(`liked_${viewingArticle.id}`) === 'true';
          setHasLiked(likedStatus);
          setArticleStats({ views: 0, likes: 0, comments: [] });

          if (!GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
            fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'recordAction', type: 'view', articleId: viewingArticle.id, data: null })
            })
            .then(res => res.json())
            .then(res => setArticleStats(res))
            .catch(() => {});
          } else {
            setArticleStats({ views: 108, likes: 25, comments: [{ name: 'ผู้อ่าน', text: 'ขอบคุณสำหรับสาระความรู้ดีๆ ครับ', date: new Date().toISOString() }] });
          }
        }
      }, [viewingArticle]);

      const handleLikeToggle = () => {
        const newLikeStatus = !hasLiked;
        setHasLiked(newLikeStatus);
        localStorage.setItem(`liked_${viewingArticle.id}`, newLikeStatus);
        setArticleStats(prev => ({ ...prev, likes: Math.max(0, prev.likes + (newLikeStatus ? 1 : -1)) }));

        if (!GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
          fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'recordAction', type: newLikeStatus ? 'like' : 'unlike', articleId: viewingArticle.id, data: null })
          })
          .then(res => res.json())
          .then(res => setArticleStats(res))
          .catch(() => {});
        }
      };

      const submitComment = (e) => {
        e.preventDefault();
        setIsCommentSubmitting(true);
        const data = { name: e.target.name.value, text: e.target.text.value };

        if (!GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
          fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'recordAction', type: 'comment', articleId: viewingArticle.id, data: data })
          })
          .then(res => res.json())
          .then(res => {
            setArticleStats(res);
            setIsCommentSubmitting(false);
            e.target.reset();
            showToast("ส่งความคิดเห็นเรียบร้อยแล้ว");
          })
          .catch(() => setIsCommentSubmitting(false));
        } else {
          setTimeout(() => {
            setArticleStats(prev => ({ ...prev, comments: [{ name: data.name, text: data.text, date: new Date().toISOString() }, ...prev.comments] }));
            setIsCommentSubmitting(false);
            e.target.reset();
            showToast("ส่งความคิดเห็นเรียบร้อยแล้ว");
          }, 600);
        }
      };

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text);
        showToast(`คัดลอก ${label} แล้ว!`);
      };

      const allArticles = useMemo(() => Object.keys(database).flatMap(tab => database[tab].map(article => ({ ...article, tabName: tab }))), [database]);
      const subcategories = useMemo(() => ["All", ...Array.from(new Set((database[activeTab] || []).map(item => item.subcategory).filter(Boolean)))], [activeTab, database]);

      const filteredArticles = useMemo(() => {
        let res = searchQuery.trim() !== "" ? allArticles.filter(i => i.title?.toLowerCase().includes(searchQuery.toLowerCase()) || i.content1?.toLowerCase().includes(searchQuery.toLowerCase()) || i.subcategory?.toLowerCase().includes(searchQuery.toLowerCase())) : (database[activeTab] || []);
        if (selectedSubcategory !== "All") res = res.filter(i => i.subcategory === selectedSubcategory);
        if (selectedDate) res = res.filter(i => i.date === selectedDate);
        res.sort((a, b) => sortOrder === "newest" ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
        return res;
      }, [activeTab, searchQuery, selectedSubcategory, selectedDate, sortOrder, database, allArticles]);

      const hasContentPart = (article, index) => article[`content${index}`] || article[`image${index}`];
      
      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setIsContactSubmitting(true);
        const data = { name: new FormData(e.target).get("name"), contact: new FormData(e.target).get("contact"), type: contactType, detail: new FormData(e.target).get("detail") };
        
        if (!GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
          fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'processContactForm', data: data })
          })
          .then(res => res.json())
          .then(() => {
            setIsContactSubmitting(false);
            e.target.reset();
            showToast("ส่งข้อความถึงทีมงานเรียบร้อยแล้ว!");
          })
          .catch(() => setIsContactSubmitting(false));
        } else {
          setTimeout(() => {
            setIsContactSubmitting(false);
            e.target.reset();
            showToast("ส่งข้อความเรียบร้อยแล้ว!");
          }, 800);
        }
      };

      const handleShare = async () => {
        if (navigator.share) {
          try { await navigator.share({ title: viewingArticle.title, url: window.location.href }); } catch(e) {}
        } else {
          copyToClipboard(window.location.href, "ลิงก์บทความ");
        }
      };

      return (
        <div className={`min-h-screen ${t.bgApp} transition-colors duration-400 font-${currentFontFamily.toLowerCase()}`}>
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-black/85 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl border border-white/10 text-sm font-medium">
              {toastMessage}
            </div>
          )}

          {/* Reading Progress Indicator */}
          {viewingArticle && (
            <div className="fixed top-0 left-0 w-full h-1 z-50 bg-transparent no-print">
              <div className="h-full bg-gradient-to-r from-emerald-400 to-[#1D9A9F] transition-all duration-150" style={{ width: `${readProgress}%` }}></div>
            </div>
          )}

          {/* Floating Back to Top Button */}
          {showScrollTop && (
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="fixed bottom-6 left-6 z-40 p-3.5 rounded-full bg-[#1D9A9F] text-white shadow-xl hover:scale-110 transition-all no-print">
              <IconArrowUp />
            </button>
          )}

          {viewingArticle ? (
            <div className="pb-24 animate-[fadeIn_0.25s_ease-out]">
              <div className="print-header text-center">
                <div className="font-amiri" style={{fontSize: '1.6em', marginBottom: '8px', fontWeight: 'bold'}}>بِسْمِهِ تَعَالَىٰ</div>
                <div>แหล่งรวมบทความและสาระดีๆ ที่ https://hardynaipayong.cloud/</div>
              </div>

              <div className={`sticky top-0 z-40 backdrop-blur-xl ${t.bgHeader} shadow-sm px-4 py-3 flex items-center justify-between no-print`}>
                <button onClick={closeArticle} className={`flex items-center gap-1.5 ${t.textMain} hover:opacity-75 p-2 rounded-xl transition-all font-medium text-sm`}>
                  <IconChevronLeft /> <span>กลับ</span>
                </button>
                
                <div className={`flex items-center gap-1 ${t.inputSearch} rounded-full px-2.5 py-1 backdrop-blur-sm border`}>
                  <button onClick={handleShare} className={`p-2 ${t.textMain} hover:text-[#1D9A9F] transition-colors`} title="แชร์"><IconShare /></button>
                  <button onClick={() => window.print()} className={`p-2 ${t.textMain} hover:text-[#1D9A9F] transition-colors`} title="พิมพ์หรือบันทึก PDF"><IconPrinter /></button>
                  <div className={`w-px h-4 ${t.hr} mx-1 border-l`}></div>
                  <button onClick={toggleFontFamily} className={`p-2 ${t.textMain} hover:text-[#1D9A9F] font-bold text-xs`} title="เปลี่ยนฟอนต์">Aa</button>
                  <button onClick={toggleTheme} className={`p-2 ${t.textMain} hover:text-[#1D9A9F]`} title="เปลี่ยนธีม"><IconPalette /></button>
                  <div className={`w-px h-4 ${t.hr} mx-1 border-l`}></div>
                  <button onClick={() => setFontSizeLevel(Math.max(0, fontSizeLevel - 1))} className={`p-1.5 ${t.textMain}`} title="ลดขนาดตัวอักษร"><IconType size="14" /></button>
                  <button onClick={() => setFontSizeLevel(Math.min(2, fontSizeLevel + 1))} className={`p-1.5 ${t.textMain}`} title="เพิ่มขนาดตัวอักษร"><IconType size="18" /></button>
                </div>
              </div>

              <main className={`max-w-3xl mx-auto mt-6 px-4 sm:px-6`}>
                <article className={`${t.bgCard} rounded-[2rem] border overflow-hidden shadow-xl ${fontSizes[fontSizeLevel]}`}>
                  {viewingArticle.image1 && (
                    <div className={`w-full h-64 sm:h-96 relative ${t.skeletonBg} no-print`}>
                      <img src={viewingArticle.image1} alt={viewingArticle.title} className="w-full h-full object-cover" />
                    </div>
                  )}
                  
                  <div className="p-6 sm:p-10">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-6 no-print">
                      <div className="flex items-center gap-2.5">
                        <span className={`${t.bgBadge} px-3.5 py-1 rounded-full font-bold text-xs tracking-wide`}>{viewingArticle.subcategory || "ทั่วไป"}</span>
                        <span className={`${t.textMuted} text-xs font-medium`}>{viewingArticle.date}</span>
                      </div>
                      <div className={`flex items-center gap-4 ${t.textMuted} text-xs font-semibold`}>
                        <span className="flex items-center gap-1.5"><IconEye /> {articleStats.views}</span>
                        <span className="flex items-center gap-1.5"><IconHeart solid={hasLiked} /> {articleStats.likes}</span>
                      </div>
                    </div>

                    <h1 className={`${headingSizes[fontSizeLevel]} font-bold ${t.textMain} mb-8 leading-snug tracking-tight`}>
                      {viewingArticle.title}
                    </h1>

                    {hasContentPart(viewingArticle, 2) && (
                      <div className={`p-5 rounded-2xl mb-8 border ${t.hr} bg-black/5 no-print`}>
                        <p className={`font-bold text-xs uppercase tracking-wider mb-3 ${t.textMuted}`}>สารบัญหัวข้อ</p>
                        <div className="flex flex-wrap gap-2">
                          {[1, 2, 3, 4, 5].map(num => hasContentPart(viewingArticle, num) && (
                            <button key={num} onClick={(e) => scrollToSection(e, num)} className={`px-3.5 py-1.5 rounded-xl text-xs font-medium border ${t.hr} ${t.inputSearch} hover:border-[#1D9A9F] transition-all`}>
                              ส่วนที่ {num}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {viewingArticle.video && (
                      <a href={viewingArticle.video} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2.5 bg-rose-500/10 text-rose-500 px-5 py-3 rounded-2xl mb-8 font-semibold text-sm hover:bg-rose-500/20 transition-all border border-rose-500/20 no-print">
                        <IconVideo /> ดูวิดีโอประกอบบทความ
                      </a>
                    )}

                    <div className={`space-y-8 ${t.textMain} leading-relaxed`}>
                      {[1, 2, 3, 4, 5].map((num) => {
                        if (!hasContentPart(viewingArticle, num)) return null;
                        return (
                          <div key={num} id={`section-${num}`} className="scroll-mt-24">
                            {viewingArticle[`image${num}`] && num !== 1 && (
                              <img src={viewingArticle[`image${num}`]} className={`w-full rounded-2xl mb-6 object-cover max-h-[50vh] border ${t.hr}`} />
                            )}
                            {viewingArticle[`content${num}`] && (
                              <div className="markdown-body text-justify" dangerouslySetInnerHTML={{ __html: parseMarkdownWithArabic(viewingArticle[`content${num}`]) }} />
                            )}
                          </div>
                        );
                      })}
                    </div>

                    {viewingArticle.source && (
                      <div className={`mt-10 pt-6 border-t ${t.hr} no-print`}>
                        <a href={viewingArticle.source} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-1.5 ${t.textMuted} hover:${t.textAccent} text-sm font-medium`}>
                          <IconExternalLink /> แหล่งข้อมูลอ้างอิง
                        </a>
                      </div>
                    )}
                    
                    {/* Action Bar */}
                    <div className={`mt-10 pt-8 border-t ${t.hr} flex items-center justify-center no-print`}>
                      <button onClick={handleLikeToggle} className={`flex items-center gap-2.5 px-6 py-3 rounded-full font-bold transition-all border ${hasLiked ? 'bg-rose-500/15 border-rose-500/40 text-rose-500 shadow-sm' : `${t.inputSearch} ${t.textMuted} hover:scale-105`}`}>
                        <IconHeart solid={hasLiked} /> {hasLiked ? 'ถูกใจแล้ว' : 'ส่งกำลังใจให้บทความนี้'} ({articleStats.likes})
                      </button>
                    </div>

                    {/* Comments */}
                    <div className={`mt-12 p-6 sm:p-8 rounded-2xl border ${t.hr} bg-black/5 no-print`}>
                      <h3 className={`text-xl font-bold ${t.textMain} mb-6 flex items-center gap-2.5`}><IconMessage /> ความคิดเห็น ({articleStats.comments.length})</h3>
                      
                      <form onSubmit={submitComment} className="mb-8 space-y-3">
                        <input type="text" name="name" placeholder="ชื่อหรือนามแฝงของคุณ" required className={`w-full px-4 py-3 rounded-xl border ${t.inputSearch} focus:outline-none text-sm`} />
                        <textarea name="text" rows="3" placeholder="เขียนข้อความแสดงความคิดเห็น..." required className={`w-full px-4 py-3 rounded-xl border ${t.inputSearch} focus:outline-none resize-none text-sm`}></textarea>
                        <div className="flex justify-end">
                          <button type="submit" disabled={isCommentSubmitting} className={`px-6 py-2.5 rounded-xl text-white font-bold text-sm transition-all ${isCommentSubmitting ? 'opacity-50' : t.btnPrimary}`}>
                            {isCommentSubmitting ? 'กำลังส่ง...' : 'โพสต์ความคิดเห็น'}
                          </button>
                        </div>
                      </form>

                      <div className="space-y-4">
                        {articleStats.comments.length > 0 ? (
                          articleStats.comments.map((cmt, idx) => (
                            <div key={idx} className={`p-4 rounded-xl ${t.bgCard} border ${t.hr}`}>
                              <div className="flex justify-between items-center mb-1.5">
                                <span className={`font-bold text-sm ${t.textMain}`}>{cmt.name}</span>
                                <span className={`text-[11px] ${t.textMuted}`}>{new Date(cmt.date).toLocaleDateString('th-TH')}</span>
                              </div>
                              <p className={`text-sm ${t.textMain} leading-relaxed whitespace-pre-wrap`}>{cmt.text}</p>
                            </div>
                          ))
                        ) : (
                          <p className={`text-center ${t.textMuted} py-4 text-sm`}>ยังไม่มีความคิดเห็น มาร่วมเป็นคนแรกที่คอมเมนต์ได้เลย</p>
                        )}
                      </div>
                    </div>
                  </div>
                </article>
              </main>
            </div>
          ) : (
            <>
              <header className={`sticky top-0 z-30 backdrop-blur-xl ${t.bgHeader} shadow-sm`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab("NEWS"); setSearchQuery(""); }}>
                    <div className={`w-10 h-10 ${t.bgBadge} rounded-xl flex items-center justify-center font-bold text-xl`}>B</div>
                    <span className={`text-xl font-bold tracking-tight hidden sm:block ${t.textMain}`}>Birds of Paradise</span>
                  </div>
                  
                  <div className="flex-1 max-w-md relative hidden md:block">
                    <div className="relative flex items-center">
                      <div className={`absolute left-4 ${t.textMuted}`}><IconSearch /></div>
                      <input type="text" placeholder="ค้นหาบทความ..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className={`w-full pl-11 pr-4 py-2.5 rounded-full ${t.inputSearch} focus:outline-none text-sm`} />
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <button onClick={toggleFontFamily} className={`p-2.5 rounded-full border ${t.tabContainer} ${t.textMuted} hover:${t.textMain}`} title="เปลี่ยนฟอนต์"><span className="font-bold text-xs">Aa</span></button>
                    <button onClick={toggleTheme} className={`p-2.5 rounded-full border ${t.tabContainer} ${t.textMuted} hover:${t.textMain}`} title="เปลี่ยนธีม"><IconPalette /></button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {!searchQuery && (
                  <div className="mb-8">
                    <h2 className={`font-amiri text-center text-3xl font-bold ${t.textMain} mb-6 tracking-wide`} dir="rtl">بِسْمِهِ تَعَالَىٰ</h2>
                    
                    <div className="relative flex items-center md:hidden mb-6">
                      <div className={`absolute left-4 ${t.textMuted}`}><IconSearch /></div>
                      <input type="text" placeholder="ค้นหาบทความ..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className={`w-full pl-11 pr-4 py-2.5 rounded-full ${t.inputSearch} focus:outline-none text-sm`} />
                    </div>
                    
                    {/* Navigation Tabs */}
                    <div className="relative flex items-center group">
                      <button onClick={() => scrollContainer(headerTabsRef, 'left')} className={`absolute left-0 z-10 p-2 ${t.scrollBtn} rounded-r-xl md:hidden`}><IconChevronLeft /></button>
                      <div ref={headerTabsRef} className={`inline-flex p-1.5 rounded-2xl ${t.tabContainer} overflow-x-auto max-w-full no-scrollbar flex-nowrap gap-1`}>
                        {[...tabOrderList, "ติดต่อและสนับสนุน"].map(tab => (
                          <button key={tab} onClick={() => { setActiveTab(tab); setSelectedSubcategory("All"); }} className={`px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${activeTab === tab ? t.tabActive : t.tabInactive}`}>
                            {tab}
                          </button>
                        ))}
                      </div>
                      <button onClick={() => scrollContainer(headerTabsRef, 'right')} className={`absolute right-0 z-10 p-2 ${t.scrollBtn} rounded-l-xl md:hidden`}><IconChevronRight /></button>
                    </div>
                  </div>
                )}

                {activeTab === "ติดต่อและสนับสนุน" ? (
                  <div className="max-w-4xl mx-auto space-y-8 animate-[fadeIn_0.3s_ease-out]">
                    <div className={`${t.bgCard} rounded-[2rem] border overflow-hidden shadow-xl`}>
                      <div className={`${t.supportCardBg} p-8 sm:p-12 text-white text-center`}>
                        <h2 className="text-2xl sm:text-3xl font-bold mb-2 flex items-center justify-center gap-2"><IconHeart /> ร่วมสนับสนุนและพูดคุยกับเรา</h2>
                        <p className="text-white/80 text-sm">แหล่งรวบรวมสาระความรู้ทางศาสนาที่ https://hardynaipayong.cloud/</p>
                      </div>

                      <div className="p-6 sm:p-10">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10">
                          {/* PromptPay */}
                          <div className={`${t.qrBox} rounded-2xl p-6 flex flex-col items-center text-center`}>
                            <h3 className="font-bold text-lg mb-4">PromptPay</h3>
                            <div className="w-40 h-40 bg-white rounded-2xl p-2 mb-4 shadow-sm border border-gray-200">
                              <img src="https://img1.pic.in.th/images/QR-Make-by-KBANK.png" alt="PromptPay QR" className="w-full h-full object-contain" />
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`font-mono text-lg font-bold ${t.textAccent}`}>2013237029</span>
                              <button onClick={() => copyToClipboard("2013237029", "เลขบัญชี")} className="p-1.5 hover:opacity-75" title="คัดลอก"><IconCopy /></button>
                            </div>
                            <p className={`text-xs ${t.textMuted} mt-1`}>ธ.กสิกรไทย (Mr. Norrarit A.)</p>
                          </div>

                          {/* USDT */}
                          <div className={`${t.qrBox} rounded-2xl p-6 flex flex-col items-center text-center`}>
                            <h3 className="font-bold text-lg mb-4">USDT (BEP-20)</h3>
                            <div className="w-40 h-40 bg-white rounded-2xl p-2 mb-4 shadow-sm border border-gray-200">
                              <img src="https://img1.pic.in.th/images/QR-USDT.png" alt="USDT QR" className="w-full h-full object-contain" />
                            </div>
                            <div className="flex items-center gap-2 bg-black/10 px-3 py-2 rounded-xl w-full justify-between">
                              <span className="font-mono text-[11px] truncate">0x3f57c6dc8815f9c66b8f37f03096ec6d00647b38</span>
                              <button onClick={() => copyToClipboard("0x3f57c6dc8815f9c66b8f37f03096ec6d00647b38", "ที่อยู่ USDT")} className="p-1 hover:opacity-75"><IconCopy /></button>
                            </div>
                            <p className={`text-xs ${t.textMuted} mt-2`}>Network: BNB Smart Chain</p>
                          </div>
                        </div>

                        {/* Contact Form */}
                        <form onSubmit={handleContactSubmit} className={`p-6 sm:p-8 rounded-2xl border ${t.hr} bg-black/5 space-y-4`}>
                          <h3 className={`text-lg font-bold ${t.textMain}`}>ส่งข้อความถึงทีมงาน</h3>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" name="name" placeholder="ชื่อของคุณ" required className={`px-4 py-3 rounded-xl border ${t.inputForm} text-sm`} />
                            <input type="text" name="contact" placeholder="ช่องทางติดต่อกลับ (อีเมล/ไลน์/เบอร์โทร)" className={`px-4 py-3 rounded-xl border ${t.inputForm} text-sm`} />
                          </div>
                          <select value={contactType} onChange={(e) => setContactType(e.target.value)} className={`w-full px-4 py-3 rounded-xl border ${t.inputForm} text-sm`}>
                            <option value="ส่งข่าวสาร">ส่งข่าวสาร / เสนอบทความ</option>
                            <option value="ความคิดเห็นหรือคำถาม">ความคิดเห็น หรือ คำถามทั่วไป</option>
                          </select>
                          <textarea name="detail" rows="4" required placeholder="พิมพ์ข้อความที่คุณต้องการส่ง..." className={`w-full px-4 py-3 rounded-xl border ${t.inputForm} text-sm resize-none`}></textarea>
                          <button type="submit" disabled={isContactSubmitting} className={`w-full py-3.5 rounded-xl text-white font-bold text-sm transition-all ${isContactSubmitting ? 'opacity-50' : t.btnPrimary}`}>
                            {isContactSubmitting ? 'กำลังส่งข้อมูล...' : 'ส่งข้อความ'}
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                ) : (
                  <>
                    {!searchQuery && (
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                        <div className="relative flex items-center w-full sm:w-auto">
                          <button onClick={() => scrollContainer(subTabsRef, 'left')} className={`absolute left-0 z-10 p-1.5 ${t.scrollBtn} rounded-r-lg md:hidden`}><IconChevronLeft /></button>
                          <div ref={subTabsRef} className="flex overflow-x-auto gap-2 no-scrollbar py-1 px-4 sm:px-0">
                            {subcategories.map(sub => (
                              <button key={sub} onClick={() => setSelectedSubcategory(sub)} className={`px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${selectedSubcategory === sub ? t.filterActive : t.filterInactive}`}>
                                {sub === "All" ? "ทั้งหมด" : sub}
                              </button>
                            ))}
                          </div>
                          <button onClick={() => scrollContainer(subTabsRef, 'right')} className={`absolute right-0 z-10 p-1.5 ${t.scrollBtn} rounded-l-lg md:hidden`}><IconChevronRight /></button>
                        </div>
                        <select value={sortOrder} onChange={(e) => setSortOrder(e.target.value)} className={`px-4 py-2 rounded-xl text-xs font-semibold border ${t.inputForm}`}>
                          <option value="newest">เรียง: ใหม่สุด</option>
                          <option value="oldest">เรียง: เก่าสุด</option>
                        </select>
                      </div>
                    )}

                    {isLoading ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {[1, 2, 3, 4, 5, 6].map(i => (
                          <div key={i} className={`${t.bgCard} rounded-2xl border ${t.hr} overflow-hidden animate-pulse`}>
                            <div className={`h-48 ${t.skeletonBg}`}></div>
                            <div className="p-5 space-y-3">
                              <div className="h-4 bg-gray-500/20 rounded w-1/3"></div>
                              <div className="h-6 bg-gray-500/20 rounded w-4/5"></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : filteredArticles.length > 0 ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredArticles.map(article => (
                          <div key={article.id} onClick={() => openArticle(article)} className={`${t.bgCard} rounded-2xl border ${t.hr} hover:-translate-y-1.5 hover:shadow-xl transition-all duration-200 cursor-pointer overflow-hidden flex flex-col group`}>
                            <div className={`aspect-[16/10] relative overflow-hidden ${t.skeletonBg}`}>
                              {article.image1 ? (
                                <img src={article.image1} alt={article.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
                              ) : (
                                <div className="w-full h-full flex items-center justify-center opacity-30 text-xs">No Cover Image</div>
                              )}
                            </div>
                            <div className="p-5 flex flex-col flex-grow">
                              <div className="flex justify-between items-center mb-3">
                                <span className={`${t.bgBadge} text-[11px] font-bold px-2.5 py-1 rounded-md`}>{article.subcategory}</span>
                                <span className={`text-[11px] ${t.textMuted}`}>{article.date}</span>
                              </div>
                              <h3 className={`font-bold ${t.textMain} text-base line-clamp-2 group-hover:${t.textAccent} transition-colors`}>{article.title}</h3>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="text-center py-20">
                        <div className={`w-16 h-16 mx-auto mb-4 rounded-full ${t.bgBadge} flex items-center justify-center`}>
                          <IconSearch />
                        </div>
                        <h3 className={`font-bold text-lg ${t.textMain}`}>ไม่พบบทความที่คุณค้นหา</h3>
                        <p className={`text-sm ${t.textMuted} mt-1`}>ลองค้นหาด้วยคำอื่น หรือเลือกหมวดหมู่อื่นดูนะครับ</p>
                      </div>
                    )}
                  </>
                )}
              </main>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
